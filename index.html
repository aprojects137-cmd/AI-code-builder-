<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Code Builder</title>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

:root {
    --bg: #080b12;
    --panel: #0f141e;
    --panel2: #151b27;
    --border: #252d3a;
    --text: #f5f7fa;
    --muted: #8b95a7;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --editor: #080b10;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow: hidden;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar {
    height: 64px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.logo {
    width: 38px;
    height: 38px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );

    color: white;

    margin-right: 9px;
}

.navbar-brand {
    color: white !important;
    font-weight: 700;
}


/* =====================================================
   APP
===================================================== */

.app {
    height: calc(100vh - 64px);
}

.sidebar,
.chat {
    background: var(--panel);
}

.sidebar {
    border-right: 1px solid var(--border);
}

.chat {
    border-left: 1px solid var(--border);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 15px;
}

.new-project {
    width: 100%;
    padding: 9px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--panel2);
    color: white;

    text-align: left;
}

.new-project:hover {
    background: #1d2533;
}

.folder {
    margin-top: 20px;
    padding: 7px;

    font-size: 14px;
    font-weight: 600;
}

.folder i {
    color: #f59e0b;
}

.file {
    padding: 8px 8px 8px 25px;

    border-radius: 7px;

    color: var(--muted);

    cursor: pointer;

    font-size: 13px;
}

.file:hover {
    background: var(--panel2);
    color: white;
}

.file.active {
    background: rgba(99,102,241,.15);
    color: #a5b4fc;
}


/* =====================================================
   CENTER
===================================================== */

.center {
    height: 100%;
    background: var(--editor);

    display: flex;
    flex-direction: column;
}


/* =====================================================
   EDITOR HEADER
===================================================== */

.editor-header {
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: var(--panel);

    border-bottom: 1px solid var(--border);
}

.tabs {
    display: flex;
    gap: 4px;
}

.tab {
    border: 0;
    background: transparent;

    color: var(--muted);

    padding: 8px 12px;

    border-radius: 7px;

    font-size: 12px;
}

.tab:hover {
    color: white;
}

.tab.active {
    background: var(--panel2);
    color: white;
}

.editor-buttons {
    display: flex;
    gap: 5px;
}


/* =====================================================
   CODE EDITOR
===================================================== */

.editor {
    height: 45%;

    position: relative;
}

#code {
    width: 100%;
    height: 100%;

    resize: none;
    outline: none;
    border: 0;

    background: var(--editor);
    color: #d1d5db;

    padding: 20px;

    font-family:
        "Fira Code",
        Consolas,
        Monaco,
        monospace;

    font-size: 14px;
    line-height: 1.7;

    tab-size: 4;
}


/* =====================================================
   PREVIEW
===================================================== */

.preview {
    flex: 1;

    background: white;

    display: flex;
    flex-direction: column;
}

.preview-header {
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    background: var(--panel);

    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);

    font-size: 12px;
}

#preview {
    width: 100%;
    flex: 1;

    border: 0;

    background: white;
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    height: 100%;

    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 15px;

    border-bottom: 1px solid var(--border);
}

.ai-name {
    font-weight: 700;
    font-size: 14px;
}

.ai-online {
    width: 8px;
    height: 8px;

    display: inline-block;

    background: #22c55e;

    border-radius: 50%;

    margin-right: 5px;
}

.chat-subtitle {
    color: var(--muted);
    font-size: 11px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 15px;
}

.message {
    display: flex;
    gap: 9px;

    margin-bottom: 18px;
}

.avatar {
    flex-shrink: 0;

    width: 31px;
    height: 31px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background: var(--primary);

    color: white;

    font-size: 13px;
}

.user .avatar {
    background: #374151;
}

.message-text {
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
}

.message-name {
    font-size: 12px;
    font-weight: 700;
    color: white;
    margin-bottom: 3px;
}


/* =====================================================
   PROMPT
===================================================== */

.prompt-area {
    padding: 13px;

    border-top: 1px solid var(--border);
}

.language-label {
    color: var(--muted);
    font-size: 11px;

    margin-bottom: 6px;
}

.language {
    background: var(--panel2);
    color: white;

    border: 1px solid var(--border);

    font-size: 12px;
}

.language:focus {
    background: var(--panel2);
    color: white;

    border-color: var(--primary);

    box-shadow: none;
}

.language option {
    background: #111827;
    color: white;
}

.prompt-box {
    margin-top: 10px;

    border: 1px solid var(--border);

    border-radius: 10px;

    background: var(--panel2);

    overflow: hidden;
}

#prompt {
    width: 100%;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    padding: 12px;

    font-size: 13px;
}

#prompt::placeholder {
    color: #667085;
}

.prompt-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 7px 9px;
}

.ai-powered {
    color: var(--muted);
    font-size: 10px;
}

.generate {
    border: 0;

    padding: 8px 13px;

    border-radius: 7px;

    background: var(--primary);

    color: white;

    font-size: 12px;
    font-weight: 600;
}

.generate:hover {
    background: var(--primary-hover);
}

.generate:disabled {
    opacity: .6;
}


/* =====================================================
   LIGHT MODE
===================================================== */

.light {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --panel2: #f0f2f5;
    --border: #dfe3e8;
    --text: #111827;
    --muted: #6b7280;
    --editor: #fafafa;
}

.light .navbar-brand {
    color: #111827 !important;
}

.light .new-project,
.light .language {
    color: #111827;
}

.light #code {
    color: #1f2937;
}

.light .message-name {
    color: #111827;
}

.light .message-text {
    color: #4b5563;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 991px) {

    body {
        overflow: auto;
    }

    .app {
        height: auto;
    }

    .sidebar {
        display: none;
    }

    .center {
        height: 700px;
    }

    .chat {
        min-height: 600px;
    }

    .editor {
        height: 400px;
    }

    .preview {
        min-height: 300px;
    }

}

</style>
</head>

<script>


// =====================================================
// FILE DATA
// =====================================================

let files = {

    html: `<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Generated Website</title>

</head>

<body>

<div class="container text-center py-5">

<h1>Hello World 👋</h1>

<p>
Your AI generated website will appear here.
</p>

<button
class="btn btn-primary"
onclick="hello()"
>
Click Me
</button>

</div>

</body>

</html>`,

    css: `body {

font-family:
Arial,
sans-serif;

background:
#f8f9fa;

}

h1 {

font-weight:
700;

}`,

    js: `function hello() {

alert(
"Hello from AI Code Builder!"
);

}`

};


// =====================================================
// CURRENT FILE
// =====================================================

let currentFile = "html";


// =====================================================
// ELEMENTS
// =====================================================

const code =
document.getElementById("code");

const prompt =
document.getElementById("prompt");

const language =
document.getElementById("language");

const messages =
document.getElementById("messages");

const preview =
document.getElementById("preview");

const generate =
document.getElementById("generate");

const generateText =
document.getElementById("generateText");


// =====================================================
// LOAD INITIAL CODE
// =====================================================

code.value = files.html;

updatePreview();


// =====================================================
// FILE TABS
// =====================================================

document.querySelectorAll(
".tab"
).forEach(tab => {

tab.addEventListener(
"click",
() => {

saveCurrentFile();

currentFile =
tab.dataset.tab;

loadCurrentFile();

document.querySelectorAll(
".tab"
).forEach(t =>
t.classList.remove("active")
);

tab.classList.add("active");

});

});


// =====================================================
// SIDEBAR FILES
// =====================================================

document.querySelectorAll(
".file"
).forEach(file => {

file.addEventListener(
"click",
() => {

saveCurrentFile();

currentFile =
file.dataset.file;

loadCurrentFile();


document.querySelectorAll(
".file"
).forEach(f =>
f.classList.remove("active")
);

file.classList.add("active");


document.querySelectorAll(
".tab"
).forEach(t =>
t.classList.remove("active")
);


const tab =
document.querySelector(
`.tab[data-tab="${currentFile}"]`
);

if(tab) {
tab.classList.add("active");
}

});

});


// =====================================================
// SAVE FILE
// =====================================================

code.addEventListener(
"input",
() => {

files[currentFile] =
code.value;

});


// =====================================================
// LOAD FILE
// =====================================================

function loadCurrentFile() {

code.value =
files[currentFile];

}


// =====================================================
// SAVE CURRENT
// =====================================================

function saveCurrentFile() {

files[currentFile] =
code.value;

}


// =====================================================
// GENERATE BUTTON
// =====================================================

generate.addEventListener(
"click",
generateCode
);


// CTRL + ENTER
// =====================================================

prompt.addEventListener(
"keydown",
event => {

if(
event.key === "Enter" &&
event.ctrlKey
) {

generateCode();

}

});


// =====================================================
// GENERATE CODE
// =====================================================

async function generateCode() {

const userPrompt =
prompt.value.trim();

if(!userPrompt) {

alert(
"Please describe what you want to build."
);

return;

}


// Add user message

addMessage(
"user",
userPrompt
);


// Clear prompt

prompt.value = "";


// Loading state

generate.disabled = true;

generateText.textContent =
"Generating...";


await sleep(1200);


// DEMO AI GENERATOR

const result =
createDemoProject(
userPrompt,
language.value
);


// Store generated files

files.html =
result.html;

files.css =
result.css;

files.js =
result.js;


// Open HTML

currentFile =
"html";


// Update editor

code.value =
files.html;


// Update active tab

document.querySelectorAll(
".tab"
).forEach(t =>
t.classList.remove("active")
);

document.querySelector(
'.tab[data-tab="html"]'
).classList.add("active");


// Update sidebar

document.querySelectorAll(
".file"
).forEach(f =>
f.classList.remove("active")
);

document.querySelector(
'.file[data-file="html"]'
).classList.add("active");


// Preview

updatePreview();


// AI message

addMessage(
"ai",
"Done! 🚀 I generated your project. You can edit the HTML, CSS and JavaScript and then click Run to preview it."
);


// Reset button

generate.disabled =
false;

generateText.textContent =
"Generate";

}


// =====================================================
// DEMO AI PROJECT
// =====================================================

function createDemoProject(
userPrompt,
selectedLanguage
) {

let title =
"AI Generated Website";

let description =
"Built with AI Code Builder.";

const lower =
userPrompt.toLowerCase();


if(
lower.includes("portfolio")
) {

title =
"My Portfolio";

description =
"Welcome to my personal portfolio.";

}


if(
lower.includes("login")
) {

title =
"Welcome Back";

description =
"Login to your account.";

}


if(
lower.includes("landing")
) {

title =
"Build Something Amazing";

description =
"Create beautiful experiences with AI.";

}


if(
lower.includes("dashboard")
) {

title =
"Analytics Dashboard";

description =
"Monitor your data from one place.";

}


// HTML

const html = `<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>${title}</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

</head>

<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a
class="navbar-brand fw-bold"
href="#"
>
AI Code Builder

</div>

</nav>


<section class="hero">

<div class="container text-center">

<span class="badge bg-primary mb-3">
AI GENERATED
</span>

<h1 class="display-3 fw-bold">
${title}

<p class="lead">

</p>

<button
class="btn btn-primary btn-lg"
onclick="showMessage()"

Get Started
</button>

</div>

</section>


<section class="container py-5">

<div class="row g-4">


<div class="col-md-4">

<div class="card feature h-100">

<div class="card-body">

<h4>
⚡ Fast
</h4>

<p>
Generate websites quickly
using AI.
</p>

</div>

</div>

</div>


<div class="col-md-4">

<div class="card feature h-100">

<div class="card-body">

<h4>
📱 Responsive
</h4>

<p>
Works beautifully across
different devices.
</p>

</div>

</div>

</div>


<div class="col-md-4">

<div class="card feature h-100">

<div class="card-body">

<h4>
🚀 Powerful
</h4>

<p>
Create modern websites
with AI.
</p>

</div>

</div>

</div>


</div>

</section>


<footer
class="text-center py-4"
>

<p class="text-muted">
Generated by AI Code Builder
</p>

</footer>


</body>

</html>`;


const css = `body {

font-family:
Arial,
sans-serif;

background:
#f8f9fa;

}

.hero {

padding:
120px 20px;

background:
linear-gradient(
135deg,
#111827,
#312e81
);

color:

}

.hero h1 {

margin-bottom:

}

.feature {

box-shadow:

.feature:hover {

translateY(-6px);

// =====================================================
// COPY
// =====================================================

document.getElementById(
"copy"
).addEventListener(
"click",
async () => {

try {

await navigator.clipboard.writeText(
code.value
);

alert(
"Code copied successfully!"
);

catch {

alert(

);

}

});


// =====================================================
// DOWNLOAD
// =====================================================

document.getElementById(
"download"
).addEventListener(
"click",
() => {

saveCurrentFile();


let extension =
"html";

if(currentFile === "css") {
extension = "css";
}

if(currentFile === "js") {
extension = "js";
}


const blob =
new Blob(
[code.value],
{
type: "text/plain"
}
);


const url =
URL.createObjectURL(
blob
);


const link =
document.createElement(
"a"
);

link.href =
url;

link.download =
`generated.${extension}`;

link.click();


URL.revokeObjectURL(
url
);

});


// =====================================================
// CHAT MESSAGE
// =====================================================

function addMessage(
type,
text
) {

const message =
document.createElement(
"div"
);

message.className =
`message ${type}`;


const icon =
type === "user"
?
"bi-person-fill"
:
"bi-robot";


const name =
type === "user"
?
"You"
:
"AI Builder";


message.innerHTML = `

<div class="avatar">

<i class="bi ${icon}"></i>

</div>

<div>

<div class="message-name">
${name}
</div>

<div class="message-text">
${escapeHtml(text)}
</div>

</div>

`;


messages.appendChild(
message
);


messages.scrollTop =
messages.scrollHeight;

}

// =====================================================
// DARK / LIGHT
// =====================================================

document.getElementById(
"theme"
).addEventListener(
"click",
() => {

document.body.classList.toggle(
"light"
);


const icon =
document.querySelector(
"#theme i"
);


if(
document.body.classList.contains(
"light"
)
) {

icon.className =
"bi bi-sun-fill";

}
else {

icon.className =
"bi bi-moon-fill";

}

});


// =====================================================
// UTILITIES
// =====================================================

function sleep(ms) {

return new Promise(
resolve =>
setTimeout(resolve, ms)
);

}


function extractBody(html) {

const match =
html.match(
/<body[^>]*>([\\s\\S]*?)<\\/body>/i
);


if(match) {

return match[1];

}


return html;

}


function escapeHtml(text) {

const element =
document.createElement(
"div"
);

element.textContent =
text;

return element.innerHTML;

}


function escapeText(text) {

return text
.replace(/\\/g, "\\\\")
.replace(/`/g, "\\`")
.replace(/\$/g, "\\$");

}
